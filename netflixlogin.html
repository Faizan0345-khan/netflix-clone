<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Netflix - Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.85)),;
            background-image:url(back.jpg) ;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Netflix Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            padding: 20px;
        }

        /* main card container - Netflix red-black theme */
        .box {
            background: rgba(0, 0, 0, 0.78);
            border-radius: 8px;
            width: 100%;
            max-width: 480px;
            padding: 48px 68px 40px;
            color: #fff;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }

        /* heading */
        .box h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 28px;
            letter-spacing: -0.2px;
        }

        /* input container spacing */
        .box1 {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
        }

        .box1 input {
            width: 100%;
            height: 56px;
            background: #333;
            border: 1px solid #5f5f5f;
            border-radius: 4px;
            padding: 0 16px;
            color: white;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s ease;
            outline: none;
        }

        .box1 input:focus {
            border-color: #e50914;
            background: #454545;
            box-shadow: 0 0 0 2px rgba(229, 9, 20, 0.3);
        }

        .box1 input::placeholder {
            color: #b3b3b3;
            font-weight: 400;
            font-size: 16px;
        }

        /* buttons generic */
        .btn {
            margin-bottom: 16px;
        }

        .btn button {
            width: 100%;
            height: 52px;
            background: #e50914;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
            font-family: inherit;
        }

        .btn button:hover {
            background: #f6121d;
        }

        /* special for second button (use sign-in code) */
        .btn-secondary {
            margin-bottom: 24px;
        }

        .btn-secondary button {
            background: rgba(109, 109, 110, 0.4);
            color: white;
            font-weight: 500;
        }

        .btn-secondary button:hover {
            background: rgba(128, 128, 130, 0.5);
        }

        /* OR separator */
        .or-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #737373;
            font-size: 14px;
            margin: 16px 0 20px;
            font-weight: 500;
        }

        .or-divider::before,
        .or-divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #404040;
        }

        .or-divider::before {
            margin-right: 16px;
        }

        .or-divider::after {
            margin-left: 16px;
        }

        /* checkbox row */
        .checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0 24px;
            font-size: 14px;
            color: #b3b3b3;
        }

        .checkbox input {
            width: 18px;
            height: 18px;
            accent-color: #e50914;
            cursor: pointer;
        }

        /* recaptcha text & link */
        .recaptcha-note {
            font-size: 13px;
            color: #8c8c8c;
            line-height: 1.4;
            margin: 16px 0 12px;
        }

        .recaptcha-note a {
            color: #0071eb;
            text-decoration: none;
        }

        .recaptcha-note a:hover {
            text-decoration: underline;
        }

        .end {
            margin-top: 12px;
            font-size: 13px;
        }

        .end a {
            color: #b3b3b3;
            text-decoration: none;
            font-size: 13px;
        }

        .end a:hover {
            text-decoration: underline;
            color: white;
        }

        /* extra footer links (netflix style) */
        .help-links {
            margin-top: 32px;
            font-size: 13px;
            color: #737373;
        }

        .help-links a {
            color: #b3b3b3;
            text-decoration: none;
        }

        .help-links a:hover {
            text-decoration: underline;
        }

        .new-to-netflix {
            margin: 20px 0 10px;
            font-size: 16px;
            color: #737373;
        }

        .new-to-netflix a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        .new-to-netflix a:hover {
            text-decoration: underline;
        }

        /* responsiveness for mobile */
        @media (max-width: 550px) {
            .box {
                padding: 32px 24px;
                max-width: 100%;
            }

            .box h1 {
                font-size: 28px;
            }
        }

        .small-alert {
            background: #e87c03;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Sign In</h1>
    
    <!-- For simple demo error notification (hidden by default) -->
    <div id="errorMsg" class="small-alert"></div>

    <div class="box1">
        <input type="text" id="loginEmail" placeholder="Email or mobile number" autocomplete="email">
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
    </div>

    <div class="btn">
        <button id="signInBtn">Log In</button>
    </div>

    <div class="or-divider">OR</div>

    <div class="btn btn-secondary">
        <button id="codeBtn">Use a Sign-In Code</button>
    </div>

    <div class="checkbox">
        <input type="checkbox" id="rememberCheckbox"> 
        <label for="rememberCheckbox">Remember Me</label>
    </div>

    <div class="recaptcha-note">
        This page is protected by Google reCAPTCHA to ensure you're not a bot. 
        <a href="#" id="learnMoreLink">Learn More</a>.
    </div>

    <div class="new-to-netflix">
        New to Netflix? <a href="#">Sign up now</a>.
    </div>

    <div class="help-links">
        <a href="#">Need help?</a>
    </div>
</div>

<script>
  
    const emailInput = document.getElementById('loginEmail');
    const passwordInput = document.getElementById('loginPassword');
    const signInButton = document.getElementById('signInBtn');
    const codeButton = document.getElementById('codeBtn');
    const rememberCheck = document.getElementById('rememberCheckbox');
    const errorMsgDiv = document.getElementById('errorMsg');

  
    function showError(message) {
        errorMsgDiv.style.display = 'block';
        errorMsgDiv.textContent = message;
       
        setTimeout(() => {
            errorMsgDiv.style.display = 'none';
        }, 4000);
    }

  
    function clearErrorOnInput() {
        if (errorMsgDiv.style.display === 'block') {
            errorMsgDiv.style.display = 'none';
        }
    }

    emailInput.addEventListener('input', clearErrorOnInput);
    passwordInput.addEventListener('input', clearErrorOnInput);

   
    function performSignIn() {
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!email) {
            showError("Please enter an email or mobile number.");
            emailInput.focus();
            return false;
        }
        if (!password) {
            showError("Please enter your password.");
            passwordInput.focus();
            return false;
        }
       
        if (email.length < 3) {
            showError("Please enter a valid email or mobile number.");
            return false;
        }
  
        if (rememberCheck.checked) {
            localStorage.setItem('netflix_remember', 'true');
            console.log("Remember me enabled: session would be persistent");
        } else {
            localStorage.removeItem('netflix_remember');
        }
        
        alert("✨ Demo sign-in successful!\n(Netflix UI clone - frontend only)\nWelcome back, " + email.split('@')[0] + "!");
        return true;
    }

   
    signInButton.addEventListener('click', (e) => {
        e.preventDefault();
        performSignIn();
    });

  
    codeButton.addEventListener('click', (e) => {
        e.preventDefault();
        alert("A sign-in code will be sent to your email or phone.\n(Feature demo — Netflix would send 6-digit code)");
    });

   
    const learnMore = document.getElementById('learnMoreLink');
    learnMore.addEventListener('click', (e) => {
        e.preventDefault();
        alert("Why am I seeing this? 🔒\nGoogle reCAPTCHA helps Netflix prevent automated bots and ensure account security. It’s an extra layer of protection.");
    });

    
    const signupLink = document.querySelector('.new-to-netflix a');
    if (signupLink) {
        signupLink.addEventListener('click', (e) => {
            e.preventDefault();
            alert("Create a new Netflix account!\n(Just a demo - redirect to signup page in real product)");
        });
    }

    const helpLink = document.querySelector('.help-links a');
    if (helpLink) {
        helpLink.addEventListener('click', (e) => {
            e.preventDefault();
            alert("Netflix Help Center\nFind solutions, account recovery, and troubleshooting.");
        });
    }

    const inputs = [emailInput, passwordInput];
    inputs.forEach(input => {
        input.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                performSignIn();
            }
        });
    });

</script>


</body>
</html>
